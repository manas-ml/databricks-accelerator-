resources:
  jobs:
    silver_transform_job:
      name: "${var.project}-${var.environment}-silver-transform"
      description: "Cleanse and enrich Bronze → Silver"

      email_notifications:
        on_failure:
          - ${var.alert_email}

      tags:
        project: ${var.project}
        environment: ${var.environment}
        layer: silver

      job_clusters:
        - job_cluster_key: etl_cluster
          new_cluster:
            num_workers: 2
            spark_version: "15.4.x-scala2.12"
            aws_attributes:
              availability: SPOT_WITH_FALLBACK
            spark_conf:
              spark.databricks.delta.optimizeWrite.enabled: "true"

      tasks:
        - task_key: cleanse_events
          job_cluster_key: etl_cluster
          notebook_task:
            notebook_path: ../src/silver/cleanse_transform
            base_parameters:
              catalog: ${var.catalog}
              bronze_schema: bronze
              silver_schema: silver
              source_table: raw_events
              target_table: clean_events
              dedup_keys: "id"
              order_by_col: "updated_at"
              environment: ${var.environment}

        - task_key: enrich_events
          job_cluster_key: etl_cluster
          depends_on:
            - task_key: cleanse_events
          notebook_task:
            notebook_path: ../src/silver/enrich_transform
            base_parameters:
              catalog: ${var.catalog}
              silver_schema: silver
              source_table: clean_events
              lookup_table: clean_customers
              target_table: enriched_events
              join_key: customer_id
              environment: ${var.environment}

        - task_key: cleanse_customers
          job_cluster_key: etl_cluster
          notebook_task:
            notebook_path: ../src/silver/cleanse_transform
            base_parameters:
              catalog: ${var.catalog}
              bronze_schema: bronze
              silver_schema: silver
              source_table: raw_customers
              target_table: clean_customers
              dedup_keys: "customer_id"
              order_by_col: "updated_at"
              environment: ${var.environment}
